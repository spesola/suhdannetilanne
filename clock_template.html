<style>
/* Layout: tasainen vaalea pohja, osiot erotettu ohuella ylaviivalla (ei kortteja). Ylapalkki, iso otsikko, kello + luettelo, yksityiskohdat alla. */
:root {
  --bg: #fbfbfc; --surface: #fbfbfc; --plot: #ffffff; --fg: #161b22; --muted: #6b7380; --line: #e3e6ea; --grid: #eceef1; --rule: #1f2933; --pt: #3d4450;
  --accent: #1d4f7f;
  --q-up: #0f5532; --q-turn: #a14f00; --q-down: #c4382e; --q-rec: #2456a3;
  --g1: #1d4f7f; --g2: #7d7aa8; --g3: #2c8077; --g4: #5c6670; --g5: #a0785a;
  --font-display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { font-variant-numeric: tabular-nums; background: var(--bg); min-height: 100%; color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 56px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }

.topbar { display: flex; justify-content: space-between; align-items: stretch; gap: 10px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.topbar .brand { padding: 6px 0 14px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--fg); text-decoration: none; font-weight: 500; font-size: 0.95rem; letter-spacing: -0.01em; }
.brand svg { width: 22px; height: 22px; flex: none; }
.brand .tld { color: var(--muted); font-weight: 400; }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sets { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.sets .sh { display: none; }
.sets button { font: inherit; font-size: 0.9rem; color: var(--muted); background: none; border: 0; padding: 6px 0 14px; margin-bottom: -1px; cursor: pointer;
  border-bottom: 2px solid transparent; }
.sets button:hover { color: var(--fg); }
.sets button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
.sets button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hero { padding-top: 4px; }
.hsum { max-width: 340px; }
.brand h1 { font: inherit; font-weight: 600; font-size: 1.02rem; letter-spacing: -0.01em; margin: 0; }
.hsum { display: flex; flex-direction: column; gap: 12px; }
#summary { display: flex; flex-direction: column; gap: 8px; }
#summary:empty { display: none; }
.upd { font-size: 0.76rem; color: var(--muted); margin: 0; }
.shead { display: flex; justify-content: space-between; gap: 8px; font-size: 0.76rem; color: var(--muted); }
.sbar { display: flex; gap: 2px; height: 8px; }
.sbar button { flex-basis: 0; min-width: 4px; border: 0; padding: 0; border-radius: 1px; background: var(--qc); cursor: pointer; }
.sbar.f button:not(.on) { opacity: .25; }
.slegend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; }
.sl { display: flex; align-items: center; gap: 7px; font: inherit; font-size: 0.82rem; color: var(--fg); background: none; border: 0; padding: 2px 0; cursor: pointer; text-align: left; }
.sl i { width: 8px; height: 8px; border-radius: 50%; background: var(--qc); flex: none; }
.sl span { flex: 1; }
.sl b { font-weight: 600; font-variant-numeric: tabular-nums; }
.sl.dim { opacity: .4; }

.top { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.top > .card:first-child { position: sticky; top: 16px; }
#topSec > .card { border-top: 0; padding-top: 0; }
@media (max-width: 860px) { .top { grid-template-columns: minmax(0, 1fr); gap: 40px; } .top > .card:first-child { position: static; } }
.card { border-top: 1px solid var(--rule); padding-top: 14px; min-width: 0; }
.phead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.phead h2 { font-family: var(--font-body); font-weight: 600; font-size: 1rem; margin: 0; }
.cdesc { font-size: 0.82rem; color: var(--muted); margin: -8px 0 8px; }
.clegend:empty { display: none; }
.clegend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.76rem; color: var(--muted); margin-bottom: 6px; align-items: center; }
.clegend span { display: inline-flex; align-items: center; gap: 6px; }
.clegend i { width: 8px; height: 8px; border-radius: 50%; background: var(--pt); display: inline-block; }
.clegend i.o { background: transparent; box-shadow: inset 0 0 0 1.5px var(--pt); }
.phead .meta { font-size: 0.85rem; color: var(--muted); }
#clock { width: 100%; height: auto; display: block; max-width: 640px; margin: 0 auto; }
#clock text { font-family: var(--font-body); }
.pt { cursor: pointer; }
.pt .lbl { opacity: 0; transition: opacity .12s; pointer-events: none; }
.pt:hover .lbl, .pt.sel .lbl { opacity: 1; }
.tg { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); cursor: pointer; }
.tg input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 8px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
.tg input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.tg input:checked { background: var(--fg); }
.tg input:checked::after { transform: translateX(12px); }
.tg input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gh { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 16px 6px 6px; margin: 0; border-radius: 0; cursor: pointer; color: var(--fg); text-align: left; }
.gh:hover { background: var(--grid); }
.gh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gh .gn { flex: 1; font-size: 0.78rem; font-weight: 600; }

.timebar { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.timebar > label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.timebar input[type=range] { flex: 1 1 200px; min-width: 0; -webkit-appearance: none; appearance: none; background: transparent; height: 20px; cursor: pointer; }
.timebar input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--fg); border-radius: 1px; }
.timebar input[type=range]::-moz-range-track { height: 2px; background: var(--fg); border-radius: 1px; }
.timebar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--plot); box-shadow: 0 0 0 1px var(--accent); }
.timebar input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--plot); box-shadow: 0 0 0 1px var(--accent); }
.timebar input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.timebar output { font-family: var(--font-data); font-size: 0.92rem; font-weight: 600; min-width: 6.5ch; text-align: right; }
.step { font: inherit; border: 1px solid var(--line); background: var(--plot); color: var(--fg); border-radius: 50%;
  width: 32px; height: 32px; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.step:hover { border-color: var(--muted); }
.step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.qbox { border-radius: 3px; padding: 4px 6px; display: flex; align-items: center; justify-content: center; gap: 10px; background: color-mix(in srgb, var(--qc) 9%, var(--bg));
  font: inherit; color: inherit; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1.5px transparent; transition: opacity .12s, box-shadow .12s; }
.qbox:hover { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--qc) 35%, transparent); }
.qbox.on { box-shadow: inset 0 0 0 1.5px var(--qc); }
.qbox.dim { opacity: .45; }
.qbox.dim:hover { opacity: .8; }
.empty { color: var(--muted); font-size: 0.88rem; padding: 8px 4px; }
.pt.off { opacity: .14; }
.pt.hl { opacity: 1; }
.pt.hl .lbl { opacity: 1; }
.pt.hl > circle:last-of-type, .pt.hl > path:last-of-type { stroke: var(--fg); stroke-width: 2.5; }
.ind.hl, .gh.hl { background: var(--grid); }
.ind .nm sup { color: var(--muted); font-size: 0.7em; margin-left: 2px; }
.ind .nm .inv { color: var(--muted); font-size: 0.72em; font-weight: 400; }
.lnote { font-size: 0.74rem; color: var(--muted); margin-top: 10px; }
.qbox .picon { flex: none; display: block; }
.qbox .n { font-family: var(--font-data); font-size: 1.05rem; font-weight: 400; color: var(--qc); line-height: 1.2; }
.qbox .n span { font-size: 0.72rem; color: var(--muted); }
.qbox .t { font-size: 0.74rem; color: var(--muted); }

.list { display: flex; flex-direction: column; margin-inline: -6px; }   /* tekstit linjaan otsikon kanssa, rivin korostus ulottuu reunan yli */
/* sarakkeet: havaintokausi | nimi | taso | muutos | vaihe */
.list { --cols: 3rem minmax(0, 1fr) 3rem 3.4rem 6.2rem; }
.lhead { display: grid; grid-template-columns: var(--cols); column-gap: 10px; font-size: 0.72rem; color: var(--muted); padding: 0 6px 6px; border-bottom: 1px solid var(--line); }
.lhead span:nth-child(3), .lhead span:nth-child(4) { text-align: right; }
.lhead span:nth-child(1) { font-size: 0.66rem; }
.lhead span:nth-child(5) { padding-left: 4px; }
.grp h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 7px; }
.grp h3 i { width: 9px; height: 9px; border-radius: 50%; background: var(--gc); display: inline-block; }
.ind { display: grid; grid-template-columns: var(--cols); column-gap: 10px; align-items: center; width: 100%;
  font: inherit; color: inherit; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 6px 6px; cursor: pointer; }
.ind .v { font-size: 0.84rem; text-align: right; font-variant-numeric: tabular-nums; }
.ind .ph { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--fg); white-space: nowrap; padding-left: 4px; }
.ind .ph i { width: 7px; height: 7px; border-radius: 50%; background: var(--qc); flex: none; }
.ind:hover { background: var(--grid); }
.ind[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.ind .nm { font-size: 0.86rem; overflow-wrap: break-word; hyphens: auto; min-width: 0; }
.ind .per { font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; }
.chip { font-size: 0.78rem; font-weight: 500; white-space: nowrap; color: var(--qc); }
.gh .chip { font-size: 0.72rem; color: var(--muted); font-weight: 400; }
.ind.comp { font-weight: 600; padding-block: 9px; }
.ind.comp .nm, .ind.comp .ph { font-weight: 600; }
.ind.lead { font-weight: 600; padding-block: 9px; }
.ind.lead .nm, .ind.lead .ph { font-weight: 600; }
.grp.gtop .ind:last-child { border-bottom: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); }

.tabs { display: flex; gap: 22px; margin: 0 0 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
#detail { border-top: 0; padding-top: 0; }
.tabs button { font: inherit; font-size: 0.9rem; font-weight: 500; color: var(--muted); background: none; border: 0;
  border-bottom: 2px solid transparent; padding: 4px 0 10px; margin-bottom: -1px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
.tabs button:disabled { opacity: .4; cursor: default; }
.viewhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.viewhead h2 { font-family: var(--font-body); font-weight: 600; font-size: 1rem; margin: 0; text-wrap: balance; }
.tsnow { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--fg); margin: 0 0 4px; }
.tsnow i { width: 7px; height: 7px; border-radius: 50%; background: var(--qc); flex: none; }
.viewhead .now { font-size: 0.85rem; color: var(--muted); }
#ts { width: 100%; height: auto; display: block; }
#ts text { font-family: var(--font-body); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
.legend span.sq::before { height: 10px; width: 10px; border-radius: 2px; vertical-align: -1px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--qc); vertical-align: middle; margin-right: 6px; }
.legend span.ds::before { background: repeating-linear-gradient(90deg, var(--qc) 0 4px, transparent 4px 7px); }
.legend.dots span::before { width: 7px; height: 7px; border-radius: 50%; vertical-align: 0; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.tile { padding: 16px 22px 14px; border-left: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile:nth-child(4n + 1) { border-left: 0; padding-left: 0; }
.tile .th { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tile .tn { font-weight: 500; font-size: 0.95rem; }
.tile .td { font-size: 0.76rem; color: var(--muted); white-space: nowrap; }
.tile .tcs { display: flex; gap: 14px; flex-wrap: wrap; }
.tile .tcx { font-family: var(--font-data); font-size: 0.8rem; color: var(--tc); white-space: nowrap; }
.tile .tcx b { font-weight: 400; color: var(--muted); margin-right: 5px; }
.tile .tcx i { font-style: normal; font-size: 0.65em; vertical-align: 1px; margin-right: 2px; }
.tile .tv { font-family: var(--font-data); font-size: 1.45rem; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile svg { width: 100%; height: 64px; display: block; margin-top: 8px; }
.tile .tf { font-size: 0.76rem; color: var(--muted); }
@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile:nth-child(4n + 1) { border-left: 1px solid var(--line); padding-left: 22px; }
  .tile:nth-child(2n + 1) { border-left: 0; padding-left: 0; }
  .tile:nth-child(n + 3) { border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .tile { padding: 14px 12px 12px; }
  .tile:nth-child(4n + 1) { padding-left: 12px; }
  .tile:nth-child(2n + 1) { padding-left: 0; }
  .tile .th { flex-wrap: wrap; gap: 0 8px; }
  .tile .tn { font-size: 0.88rem; }
  .tile .tcs { gap: 2px 8px; }
  .tile .tcx { font-size: 0.72rem; }
  .tile .tcx b { margin-right: 3px; }
  .tile .tv { font-size: 1.2rem; }
  .tile .tfn { display: none; }
}
.fgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 48px 48px; }
.fcard { grid-column: span 2; }
.tsgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.tsgrid.solo { grid-template-columns: minmax(0, 1fr); }
#tsContrib { grid-template-columns: minmax(0, 1fr); }
#tsContrib .card { border-top: 0; padding-top: 0; }
@media (max-width: 860px) { .tsgrid { grid-template-columns: minmax(0, 1fr); } #tsContrib .card { border-top: 1px solid var(--rule); padding-top: 14px; } }
.fcard.half { grid-column: span 3; }
.fcard.wide { grid-column: 1 / -1; }
.fcard.tt { grid-column: 1 / span 4; }
@media (max-width: 980px) { .fgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fcard, .fcard.half { grid-column: auto; } .fcard.wide, .fcard.tt { grid-column: 1 / -1; } }
@media (max-width: 640px) { .fgrid { grid-template-columns: minmax(0, 1fr); } }
button.dl { font: inherit; font-size: 0.76rem; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; margin-left: 10px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
button.dl:hover { text-decoration-color: var(--fg); }
.fmeta { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-top: 8px; }
.fmeta .legend { margin-top: 0; }
.fmeta > .dl { margin-left: auto; }

<script>
(async function () {
  // Data upotettuna (pipeline.R:n tuottama suhdannetilanne.html) tai haettuna viereisesta clock.json:sta (julkaisu)
  const embedded = document.getElementById("data").textContent.trim();
  let D;
  try {
    D = embedded.startsWith("__") ? await (await fetch("clock.json", { cache: "no-cache" })).json() : JSON.parse(embedded);
  } catch (e) {
    document.querySelector(".wrap").innerHTML = "<p>Dataa ei saatu ladattua. Aja pipeline.R ja avaa suhdannetilanne.html, tai tarjoile sivu palvelimelta clock.json:n vierestä.</p>";
    return;
  }
  const NS = "http://www.w3.org/2000/svg";
  const Q = {
    up:   { name: "Noususuhdanne", short: "Nousu",   v: "--q-up" },
    turn: { name: "Hidastuminen",  short: "Hidastuminen", v: "--q-turn" },
    down: { name: "Laskusuhdanne", short: "Lasku",   v: "--q-down" },
    rec:  { name: "Elpyminen",     short: "Elpyminen", v: "--q-rec" }
  };
  const QORDER = ["up", "turn", "down", "rec"];
  const GVARS = ["--g1", "--g2", "--g3", "--g4", "--g5"];
  const LIM = 2.5;

  let set = D.sets.find(s => s.default) || D.sets[0];
  const defIdx = st => st.composite ? Math.max(0, st.periods.indexOf(st.composite.last)) : st.periods.length - 1;   // viimeisin kuukausi, jolta kaikki sarjat
  let idx = defIdx(set);
  let sel = null;            // indikaattorin id, "comp" tai null
  let qf = null;             // vaihesuodatin: up/turn/down/rec tai null
  let tab = "ts";
  let showTails = false;
  const gcache = new Map();

  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const quad = (l, c) => l >= 0 ? (c >= 0 ? "up" : "turn") : (c < 0 ? "down" : "rec");
  const qcol = q => `var(${Q[q].v})`;
  const gcol = g => `var(${GVARS[Math.max(0, set.groups.indexOf(g)) % GVARS.length]})`;
  const fmtP = p => p.includes("Q") ? p.slice(5) + "/" + p.slice(0, 4) : (+p.slice(5)) + "/" + p.slice(0, 4);
  const fmtN = v => { const r = Math.round(v * 10) / 10; return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(1).replace(".", ","); };
  const tick = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
  const clip = v => Math.max(-LIM + 0.08, Math.min(LIM - 0.08, v));

  function comp() { return { id: "comp", label: "Kokonaisindikaattori", last: set.composite.last,
    level: set.composite.level, change: set.composite.change, comp: true }; }
  // ryhmapiste: ryhman sarjojen tasojen keskiarvo (vain jaksot, joilla kaikki sarjat ovat saatavilla)
  function grp(g) {
    const key = set.id + "|" + g; if (gcache.has(key)) return gcache.get(key);
    const mem = set.indicators.filter(s => s.group === g), n = set.periods.length, lvl = new Array(n).fill(null);
    for (let k = 0; k < n; k++) { let sum = 0, ok = true;
      for (const s of mem) { const v = s.level[k]; if (v == null) { ok = false; break; } sum += v; }
      if (ok) lvl[k] = sum / mem.length; }
    const d = []; for (let k = 1; k < n; k++) if (lvl[k] != null && lvl[k - 1] != null) d.push(lvl[k] - lvl[k - 1]);
    const m = d.reduce((a, b) => a + b, 0) / d.length, sd = Math.sqrt(d.reduce((a, b) => a + (b - m) ** 2, 0) / (d.length - 1)) || 1;
    const chg = lvl.map((v, k) => k > 0 && v != null && lvl[k - 1] != null ? (v - lvl[k - 1]) / sd : null);
    let li = 0; for (let k = n - 1; k >= 0; k--) if (lvl[k] != null && chg[k] != null) { li = k; break; }
    const o = { id: "g:" + g, label: g, group: g, isGroup: true, last: set.periods[li], level: lvl, change: chg };
    gcache.set(key, o); return o;
  }
  function findItem(id) { if (id === "comp") return comp(); if (id.startsWith("g:")) return grp(id.slice(2)); return set.indicators.find(x => x.id === id); }
  function lastIdx(s) { return set.periods.indexOf(s.last); }
  function at(s, i) {
    const j = Math.min(i, lastIdx(s)); let k = j;
    while (k >= 0 && (s.level[k] == null || s.change[k] == null)) k--;
    return k < 0 ? null : { i: k, l: s.level[k], c: s.change[k], stale: k < i };
  }

  /* ---------- otsikko ja settivalitsin ---------- */
  const SHORT = { suhdanne: "Suhdanne", bkt: "Reaalitalous", rahoitus: "Rahoitus" };
  function renderHeader() {
    const gen = new Date(D.meta.generated.replace(/(\+\d{2})(\d{2})$/, "$1:$2"));
    const c0 = set.view === "charts" ? set.charts.find(c => c.lines && c.lines.length) : null;
    const lastAll = c0 ? set.periods[lastNN(set.series.find(x => x.id === (c0.bars || c0.lines[0])).values)] : set.periods[set.periods.length - 1];
    $("headline").textContent = set.label;
    $("sub").textContent = `Päivitetty ${gen.toLocaleDateString("fi-FI")}. Viimeisin havainto ${fmtP(lastAll)}.`;
    const box = $("sets"); box.innerHTML = "";
    D.sets.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.innerHTML = `<span class="lg">${s.label}</span><span class="sh">${SHORT[s.id] || s.label}</span>`;
      b.setAttribute("aria-pressed", s.id === set.id); b.onclick = () => { if (s.id === set.id) return;
        stopPlay(); set = s; idx = defIdx(s); sel = null; qf = null; renderAll(); }; box.appendChild(b); });
  }

  /* ---------- kello ---------- */
  // vaihekuvake: sykli y = cy - amp*cos(2*pi*t), pohja keskella kuten kellossa: vasen puoli laskee, oikea nousee.
  // hidastuminen 0-0.25 (vasen ylä), lasku 0.25-0.5 (vasen ala), elpyminen 0.5-0.75 (oikea ala), nousu 0.75-1 (oikea ylä)
  const PHASE = { turn: [0, 0.25], down: [0.25, 0.5], rec: [0.5, 0.75], up: [0.75, 1] };
  const QPOS = { turn: [0, 0], up: [1, 0], down: [0, 1], rec: [1, 1] };
  function phaseIcon(q, s = 32) {
    const p = 4, w = s - 2 * p, amp = s / 2 - 8, cx = s / 2, cy = s / 2;
    const pt = t => [p + t * w, cy - amp * Math.cos(2 * Math.PI * t)];
    const seg = (a, b) => { let d = ""; for (let k = 0; k <= 24; k++) { const [x, y] = pt(a + (b - a) * k / 24); d += (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); } return d; };
    const [a, b] = PHASE[q], [ex, ey] = pt(b), c = qcol(q), [qx, qy] = QPOS[q];
    return `<line x1="1" x2="${s - 1}" y1="${cy}" y2="${cy}" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>` +
      `<line y1="1" y2="${s - 1}" x1="${cx}" x2="${cx}" stroke="var(--muted)" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>` +
      `<path d="${seg(0, 1)}" fill="none" stroke="var(--muted)" stroke-opacity="0.5" stroke-width="1.2"/>` +
      `<path d="${seg(a, b)}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>` +
      `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.6" fill="${c}"/>`;
  }
  const iconHTML = (q, s = 30) => `<svg class="picon" width="${s}" height="${s}" viewBox="0 0 32 32" role="img" aria-label="${Q[q].name}"><title>${Q[q].name}</title>${phaseIcon(q)}</svg>`;

  const W = 600, M = 40, S = (W - 2 * M) / (2 * LIM);
  const X = c => M + (clip(c) + LIM) * S, Y = l => M + (LIM - clip(l)) * S;

  function renderClock() {
    const svg = $("clock"); svg.innerHTML = "";
    const K = svg.clientWidth && svg.clientWidth < 420 ? 1.6 : 1;   // kapealla naytolla pisteet suuremmiksi
    const mid = W / 2, inner = W - 2 * M;
    // tausta: vaiheiden neljannekset vaalealla savylla, valkoinen ruudukko
    [["turn", M, M], ["up", mid, M], ["down", M, mid], ["rec", mid, mid]].forEach(([q, x, y]) =>
      el("rect", { x, y, width: inner / 2, height: inner / 2, fill: `color-mix(in srgb, ${qcol(q)} 6%, var(--plot))` }, svg));
    for (let v = -2; v <= 2; v++) { if (!v) continue;
      el("line", { x1: X(v), x2: X(v), y1: M, y2: W - M, stroke: "var(--plot)", "stroke-width": 1.5 }, svg);
      el("line", { y1: Y(v), y2: Y(v), x1: M, x2: W - M, stroke: "var(--plot)", "stroke-width": 1.5 }, svg);
      el("text", { x: X(v), y: W - M + 16, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" }, svg).textContent = tick(v);
      el("text", { x: M - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, svg).textContent = tick(v);
    }
    el("line", { x1: mid, x2: mid, y1: M, y2: W - M, stroke: "var(--muted)", "stroke-width": 1, "stroke-opacity": 0.55 }, svg);
    el("line", { y1: mid, y2: mid, x1: M, x2: W - M, stroke: "var(--muted)", "stroke-width": 1, "stroke-opacity": 0.55 }, svg);
    // vaiheiden nimet kulmiin
    [["turn", M + 12, M + 22, "start"], ["up", W - M - 12, M + 22, "end"], ["down", M + 12, W - M - 14, "start"], ["rec", W - M - 12, W - M - 14, "end"]].forEach(([q, x, y, a]) => {
      const t = el("text", { x, y, "text-anchor": a, "font-size": 12, "font-weight": 600, fill: "var(--fg)" }, svg);
      el("tspan", { fill: qcol(q), "font-size": "1.05em" }, t).textContent = "\u25CF ";
      el("tspan", {}, t).textContent = Q[q].short; });
    const growthClock = set.indicators.every(x => x.kind === "growth");
    const T = growthClock ? ["Keskimääräistä nopeampi kasvu", "Keskimääräistä hitaampi kasvu", "Kasvu hidastuu", "Kasvu kiihtyy"]
                          : ["Trendin yläpuolella", "Trendin alapuolella", "Heikentynyt", "Vahvistunut"];
    const axl = (t, x, y, a, cls = "") => { el("text", { class: "axl " + cls, x, y, "text-anchor": a, "font-size": 11, fill: "var(--muted)" }, svg).textContent = t; };
    axl(T[0], mid + 8, M + 20, "start", "top"); axl(T[1], mid + 8, W - M - 12, "start", "bot");
    axl(T[2], M + 10, mid + 18, "start"); axl(T[3], W - M - 10, mid + 18, "end");

    const items = [];
    set.groups.forEach(g => {
      const mem = set.indicators.filter(s => s.group === g); if (!mem.length) return;
      mem.forEach(s => items.push({ s, col: "var(--pt)" }));
    });
    items.push({ s: comp(), col: "var(--fg)" });
    const placed = [];
    const hi = s => sel === s.id || (!!sel && sel === "g:" + s.group && !s.isGroup && !s.comp);
    items.forEach(({ s, col }) => {
      const p = at(s, idx); if (!p) return;
      const off = qf && (quad(p.l, p.c) !== qf || (!s.comp && !s.isGroup && !s.in_composite)) && !hi(s);
      const g = el("g", { class: "pt" + (hi(s) ? " sel" : "") + (off ? " off" : ""), tabindex: -1, "data-id": s.id, opacity: p.stale && !s.comp ? 0.45 : 1 }, svg);
      const pts = [], from = (showTails || hi(s) || s.comp) ? Math.max(0, p.i - set.tail) : p.i;   // kokonaisindikaattorin polku aina
      for (let k = from; k <= p.i; k++)
        if (s.level[k] != null && s.change[k] != null) pts.push([X(s.change[k]), Y(s.level[k])]);
      if (pts.length > 1) {
        el("polyline", { points: pts.map(q => q.join(",")).join(" "), fill: "none", stroke: col,
          "stroke-width": s.comp || s.isGroup ? 1.2 : 1.1, "stroke-opacity": s.comp ? 0.45 : 0.4, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
        pts.slice(0, -1).forEach((q, k) => el("circle", { cx: q[0], cy: q[1], r: (s.comp ? 1.7 : 1.6) * K, fill: col, "fill-opacity": 0.2 + 0.4 * k / pts.length }, g));
      }
      const [hx, hy] = pts[pts.length - 1];
      const r = ((s.comp ? 6.5 : s.isGroup ? 7 : 5) + (hi(s) ? 2 : 0)) * K;
      const hollow = !s.comp && !s.isGroup && !s.in_composite;           // ei kokonaisindikaattorissa: ontto piste
      el("circle", { cx: hx, cy: hy, r, fill: hollow ? "var(--plot)" : s.comp ? "var(--fg)" : col, stroke: hollow ? col : "var(--plot)", "stroke-width": hollow ? 1.6 : 1.5 }, g);
      const right = hx + r + 8 + s.label.length * 6.6 < W - M;   // nimi oikealle, jos mahtuu kehyksen sisaan
      const lbl = el("text", { class: "lbl", x: hx + (right ? r + 6 : -r - 6), y: hy - 10, "text-anchor": right ? "start" : "end",
        "font-size": s.isGroup ? 12.5 : 12, "font-weight": s.isGroup ? 600 : 500, fill: "var(--fg)", stroke: "var(--surface)", "stroke-width": 4, "paint-order": "stroke" }, g);
      lbl.textContent = s.label;
      el("title", {}, g).textContent = `${s.label}, ${fmtP(set.periods[p.i])}: taso ${fmtN(p.l)}, muutos ${fmtN(p.c)}`;
      if (hi(s)) placed.push(lbl);
      g.addEventListener("click", () => select(s.id));
      g.addEventListener("mouseenter", () => { if (svg.lastChild !== g) svg.appendChild(g); hlRow(s.id); });   // paalle, ettei nimi jaa muiden pisteiden alle
      g.addEventListener("mouseleave", () => hlRow(null));
    });
    placed.forEach(t => svg.appendChild(t.parentNode));   // valittujen nimet muiden pisteiden paalle
    // nimien tormaysten esto: ylhaalta alas, paallekkainen nimi siirtyy rivin alemmas
    const boxes = [];
    placed.map(t => ({ t, x: +t.getAttribute("x"), y: +t.getAttribute("y"), w: t.textContent.length * 7.4,
                       end: t.getAttribute("text-anchor") === "end" }))
      .sort((a, b) => a.y - b.y)
      .forEach(o => {
        const x0 = o.end ? o.x - o.w : o.x, x1 = x0 + o.w; let y = o.y;
        for (let k = 0; k < 8; k++) {
          const hit = boxes.find(b => x0 < b.x1 && x1 > b.x0 && Math.abs(y - b.y) < 15);
          if (!hit) break; y = hit.y + 15;
        }
        o.t.setAttribute("y", y); boxes.push({ x0, x1, y });
      });
  }

  /* ---------- aikavalitsin ---------- */
  function renderTime() {
    $("tailsTg").title = `Näytä pisteiden kulku ${set.tail} ${set.freq === "M" ? "kuukauden" : "neljänneksen"} ajalta`;
    $("tailsLbl").textContent = `Kulku ${set.tail} ${set.freq === "M" ? "kk" : "nelj."}`;
    const r = $("per"); r.max = set.periods.length - 1; r.value = idx;
    $("perOut").textContent = fmtP(set.periods[idx]);
  }
  $("tails").addEventListener("change", e => { showTails = e.target.checked; update(); });
  $("per").addEventListener("input", e => { stopPlay(); idx = +e.target.value; update(); });
  $("prev").onclick = () => { stopPlay(); if (idx > 0) { idx--; update(); } };
  $("next").onclick = () => { stopPlay(); if (idx < set.periods.length - 1) { idx++; update(); } };

  /* ---------- yhteenveto ja luettelo ---------- */
  function renderPanel() {
    const counts = { up: 0, turn: 0, down: 0, rec: 0 }; let n = 0;
    set.indicators.forEach(s => { if (!s.in_composite) return; const p = at(s, idx); if (p) { counts[quad(p.l, p.c)]++; n++; } });
    // yhteenveto: vaiheiden osuudet palkkina ja lukuina; klikkaus suodattaa kartan ja luettelon
    $("summary").innerHTML = `<div class="shead"><span>Kokonaisindikaattorin ${n} sarjaa</span><span>${fmtP(set.periods[idx])}</span></div>` +
      `<div class="sbar${qf ? " f" : ""}">${QORDER.filter(q => counts[q]).map(q => `<button type="button" data-q="${q}" class="${qf === q ? "on" : ""}" style="--qc:${qcol(q)};flex-grow:${counts[q]}" title="${Q[q].name}: ${counts[q]}" aria-label="${Q[q].name}: ${counts[q]}"></button>`).join("")}</div>` +
      `<div class="slegend">${QORDER.map(q => `<button type="button" class="sl${qf && qf !== q ? " dim" : ""}" data-q="${q}" aria-pressed="${qf === q}" style="--qc:${qcol(q)}" title="Näytä vain: ${Q[q].name.toLowerCase()}"><i></i><span>${Q[q].short}</span><b>${counts[q]}</b></button>`).join("")}</div>`;
    $("summary").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { qf = qf === b.dataset.q ? null : b.dataset.q; update(); });
    const pass = s => { if (!qf) return true; if (!s.comp && !s.in_composite) return false; const p = at(s, idx); return !!p && quad(p.l, p.c) === qf; };

    const list = $("list"); list.innerHTML = `<div class="lhead"><span>Havainto</span><span>Sarja</span><span>Taso</span><span>Muutos</span><span>Vaihe</span></div>`;
    const mk = (s, extraCls) => {
      const p = at(s, idx); const b = document.createElement("button"); b.type = "button";
      b.className = "ind" + (extraCls || ""); b.setAttribute("aria-pressed", sel === s.id);
      const q = p ? quad(p.l, p.c) : null;
      const out = !s.comp && !s.in_composite;
      b.dataset.id = s.id;
      b.innerHTML = `<span class="per" title="Havaintokausi">${p ? fmtP(set.periods[p.i]) : "–"}</span>` +
        `<span class="nm">${s.label}${s.invert ? ` <span class="inv" title="Käännetty sarja: nousu näkyy negatiivisena">käänt.</span>` : ""}${out ? `<sup title="Ei mukana kokonaisindikaattorissa">*</sup>` : ""}</span>` +
        `<span class="v">${p ? fmtN(p.l) : "–"}</span><span class="v">${p ? fmtN(p.c) : "–"}</span>` +
        (q ? `<span class="ph" style="--qc:${qcol(q)}" title="${Q[q].name}"><i></i><span class="pt-t">${Q[q].short}</span></span>` : `<span></span>`);
      b.onclick = () => select(s.id);
      b.onmouseenter = () => hlPoints([s.id]); b.onmouseleave = () => hlPoints([]);
      return b;
    };
    // lead: tarkeimmat sarjat (esim. BKT) heti kokonaisindikaattorin alle, ei ryhmansa alla
    const lead = (set.lead || []).map(id => set.indicators.find(x => x.id === id)).filter(Boolean), isLead = s => lead.includes(s);
    const top = document.createElement("div"); top.className = "grp gtop";
    if (pass(comp())) top.appendChild(mk(comp(), " comp"));
    lead.filter(pass).forEach(s => top.appendChild(mk(s, " lead")));
    if (top.children.length) list.appendChild(top);
    set.groups.forEach((g, gi) => {
      const all = set.indicators.filter(s => s.group === g && !isLead(s)), mem = all.filter(pass); if (!mem.length) return;
      const box = document.createElement("div"); box.className = "grp";
      const h = document.createElement("button"); h.type = "button"; h.className = "gh";
      h.style.setProperty("--gc", `var(${GVARS[gi % GVARS.length]})`);
      const gp = all.length > 1 ? at(grp(g), idx) : null, gq = gp ? quad(gp.l, gp.c) : null;
      h.setAttribute("aria-pressed", sel === "g:" + g);
      h.innerHTML = `<span class="gn">${g}</span>`;   // ryhman vaihe nakyy valittaessa, ei listassa
      h.onclick = () => select("g:" + g); h.dataset.g = g;
      h.onmouseenter = () => hlPoints(all.map(x => x.id)); h.onmouseleave = () => hlPoints([]);
      box.appendChild(h); mem.forEach(s => box.appendChild(mk(s))); list.appendChild(box);
    });
    if (list.children.length === 1) list.insertAdjacentHTML("beforeend", `<div class="empty">Ei indikaattoreita vaiheessa ${Q[qf].name.toLowerCase()}.</div>`);
    const notes = [set.indicators.some(s => !s.in_composite) ? "* Ei mukana kokonaisindikaattorissa." : "",
                   set.indicators.some(s => s.invert) ? "Käänt. = käännetty sarja, nousu näkyy negatiivisena." : ""].filter(Boolean);
    if (notes.length) list.insertAdjacentHTML("beforeend", `<p class="lnote">${notes.join(" ")}</p>`);
  }

  // kartan ja luettelon kytkentä: rivin hover korostaa pisteen ja nayttaa nimen, pisteen hover korostaa rivin
  function hlPoints(ids) {
    const svg = $("clock");
    svg.querySelectorAll(".pt.hl").forEach(g => g.classList.remove("hl"));
    ids.forEach(id => { const g = svg.querySelector(`.pt[data-id="${CSS.escape(id)}"]`); if (g) { g.classList.add("hl"); svg.appendChild(g); } });
  }
  function hlRow(id) {
    document.querySelectorAll("#list .ind.hl").forEach(r => r.classList.remove("hl"));
    if (id) { const r = document.querySelector(`#list .ind[data-id="${CSS.escape(id)}"]`); if (r) r.classList.add("hl"); }
  }

  function select(id) {
    sel = sel === id ? null : id;
    if (sel) setTab("ts");
    if (set.growth) grSel = sel && set.growth.some(r => r.id === sel) ? sel : "bkt";
    update();
  }

  /* ---------- aikasarja ---------- */
  function renderTS() {
    const s = (sel && findItem(sel)) || comp();
    const lvlKind = s.kind === "level";   // esim. konkurssit: taso suhteessa omaan historiaan, ei trendia
    const growthTS = s.kind === "growth" || (s.comp && set.indicators.every(x => x.kind === "growth"));
    $("tsTitle").textContent = s.label;
    $("tsSub").textContent = (lvlKind ? "Taso suhteessa omaan historiaan vuodesta 2010 keskihajontoina."
      : growthTS ? "Kasvun ero omaan keskiarvoonsa keskihajontoina." : "Poikkeama pitkän aikavälin trendistä keskihajontoina.") +
      " Harmaa vyöhyke on tavanomainen vaihtelu, −1…+1. Klikkaa kuvaa vaihtaaksesi ajankohtaa.";
    // oikea puoli: osatekijat (luottamus ym.), BKT-vertailu (kokonaisindikaattori) tai lahteen julkaisema arvo
    let cc = set.contribs && set.contribs[sel || "comp"];
    if (!cc && s.isGroup) {               // ryhma = sarjojen poikkeamien keskiarvo, joten osuus = poikkeama / n (tasmalleen)
      const mem = set.indicators.filter(x => x.group === s.group), n0 = mem.length;
      set.series = (set.series || []).filter(x => !x.id.startsWith("__g"))
        .concat([{ id: "__gline", label: s.label, values: s.level }],
                mem.map(x => ({ id: "__g_" + x.id, label: x.label, values: x.level.map((v, k) => s.level[k] == null || v == null ? null : v / n0) })));
      cc = { id: "grp_" + s.group, title: `${s.label}: sarjojen osuudet`, lines: ["__gline"], stack: mem.map(x => "__g_" + x.id),
             unit: "", stackUnit: "", dec: 2, from: 2010, lineColor: "var(--fg)",
             note: `Ryhmän poikkeama on sarjojen keskiarvo; palkki = sarjan poikkeama / ${n0}.` };
    }
    if (!cc && s.raw && s.raw.some(v => v != null)) {
      const hasTr = s.trend && s.trend.some(v => v != null);
      // keskiarvo vuodesta 2010: tasovertailu trendin rinnalle (kartta vertaa trendiin, ei keskiarvoon)
      const k10 = Math.max(0, set.periods.indexOf("2010-01")), r10 = s.raw.slice(k10).filter(v => v != null);
      const avg = r10.reduce((a, b) => a + b, 0) / r10.length, avgVals = s.raw.map((v, k) => k >= k10 ? avg : null);
      const hasSa = s.sa && s.sa.some(v => v != null);   // kausitasoittamaton lahde: oma STL-kausitasoitus paaviivaksi
      set.series = (set.series || []).filter(x => !["__raw", "__sa", "__trend", "__avg"].includes(x.id))
        .concat(hasSa ? [{ id: "__sa", label: "Kausitasoitettu", values: s.sa }] : [],
                [{ id: "__raw", label: hasSa ? "Alkuperäinen" : "Julkaistu arvo", values: s.raw }], hasTr ? [{ id: "__trend", label: "Pitkän aikavälin trendi", values: s.trend }] : [],
                [{ id: "__avg", label: "Keskiarvo 2010–", values: avgVals }]);
      const big = Math.max(...s.raw.filter(v => v != null).map(Math.abs)) >= 1000;
      cc = { id: "raw_" + s.id, title: `${s.label}: ${hasSa ? "kausitasoitettu" : "julkaistu arvo"}`,
             lines: ["__raw", ...(hasSa ? ["__sa"] : []), ...(hasTr ? ["__trend"] : []), "__avg"], dash: ["__trend"], dot: ["__avg"], thin: hasSa ? ["__raw"] : [],
             unit: "", dec: big ? 0 : 1, from: 2010,
             note: [hasSa ? "Kausitasoitus oma laskelma" : s.raw_desc, s.unit].filter(Boolean).join(", ") + (hasTr ? ". Kartta vertaa trendiin, ei keskiarvoon." : ".") };
      set.colors = { ...(set.colors || {}), __sa: "var(--accent)", __raw: hasSa ? "var(--line)" : "var(--accent)", __trend: "var(--muted)", __avg: "var(--q-turn)" };
    }
    if (cc) [...cc.lines, ...(cc.stack || [])].filter(id => id.startsWith("raw:")).forEach(id => {   // raw:<sarja> = julkaistu arvo
      const ind = set.indicators.find(x => x.id === id.slice(4)); if (!ind) return;
      set.series = (set.series || []).filter(x => x.id !== id).concat([{ id, label: ind.label, values: ind.raw }]); });
    $("tsGrid").classList.toggle("solo", !cc);
    if (cc) renderCharts($("tsContrib"), [{ ...cc, wide: true, w: 560, height: 300, defIdx: idx, ts: true, rawv: cc.id.startsWith("raw_") }]); else $("tsContrib").innerHTML = "";
    const p = at(s, idx);
    $("tsNow").innerHTML = p ? `<i style="--qc:${qcol(quad(p.l, p.c))}"></i>${Q[quad(p.l, p.c)].name} ${fmtP(set.periods[p.i])}. Taso ${fmtN(p.l)}, muutos ${fmtN(p.c)}.` : "";
    const svg = $("ts"); svg.innerHTML = "";
    const solo = !cc, W2 = solo ? 960 : 560, H2 = solo ? 230 : 300, ml = 40, mr = 14, mt = 12, mb = 28;
    svg.setAttribute("viewBox", `0 0 ${W2} ${H2}`);
    const n = set.periods.length, xs = i => ml + i * (W2 - ml - mr) / (n - 1);
    const vals = s.level.filter(v => v != null);
    const lim = Math.max(2.5, Math.ceil(Math.max(...vals.map(Math.abs)) * 2) / 2);
    const ys = v => mt + (lim - v) / (2 * lim) * (H2 - mt - mb);
    el("rect", { x: ml, y: ys(1), width: W2 - ml - mr, height: ys(-1) - ys(1), fill: "var(--grid)", "fill-opacity": 0.75 }, svg);   // tavanomainen vaihtelu
    for (let v = -Math.floor(lim); v <= Math.floor(lim); v++) {
      el("line", { x1: ml, x2: W2 - mr, y1: ys(v), y2: ys(v), stroke: v ? "var(--grid)" : "var(--muted)", "stroke-width": 1 }, svg);
      el("text", { x: ml - 6, y: ys(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, svg).textContent = tick(v);
    }
    set.periods.forEach((per, i) => {
      const yr = per.slice(0, 4), first = i === 0 || set.periods[i - 1].slice(0, 4) !== yr;
      if (first && (+yr % (solo ? 2 : 5) === 0)) {
        el("line", { x1: xs(i), x2: xs(i), y1: H2 - mb, y2: H2 - mb + 4, stroke: "var(--muted)" }, svg);
        el("text", { x: xs(i), y: H2 - 8, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" }, svg).textContent = yr;
      }
    });
    el("line", { x1: xs(idx), x2: xs(idx), y1: mt, y2: H2 - mb, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "2 3" }, svg);
    for (let i = 1; i < n; i++) {
      const a = s.level[i - 1], b = s.level[i], c = s.change[i];
      if (a == null || b == null || c == null) continue;
      el("line", { x1: xs(i - 1), y1: ys(a), x2: xs(i), y2: ys(b), stroke: qcol(quad(b, c)), "stroke-width": 2.6, "stroke-linecap": "round" }, svg);
    }
    if (p) el("circle", { cx: xs(p.i), cy: ys(p.l), r: 4.5, fill: qcol(quad(p.l, p.c)), stroke: "var(--surface)", "stroke-width": 2 }, svg);
    // hover-viiva seuraa hiirta ja on synkassa viereisen kuvan kanssa (chartHooks)
    const hov = el("line", { y1: mt, y2: H2 - mb, stroke: "var(--fg)", "stroke-opacity": 0.35, "stroke-width": 1, visibility: "hidden" }, svg);
    const hovDot = el("circle", { r: 4, fill: "var(--surface)", stroke: "var(--fg)", "stroke-width": 1.5, visibility: "hidden" }, svg);
    const moveHov = i => { if (i == null || i < 0 || i >= n) { hov.setAttribute("visibility", "hidden"); hovDot.setAttribute("visibility", "hidden"); return; }
      hov.setAttribute("x1", xs(i)); hov.setAttribute("x2", xs(i)); hov.setAttribute("visibility", "visible");
      if (s.level[i] != null) { hovDot.setAttribute("cx", xs(i)); hovDot.setAttribute("cy", ys(s.level[i])); hovDot.setAttribute("visibility", "visible"); }
      else hovDot.setAttribute("visibility", "hidden"); };
    const sideHooks = chartHooks.slice(); chartHooks.push(moveHov);
    const hit = el("rect", { x: ml, y: mt, width: W2 - ml - mr, height: H2 - mt - mb, fill: "transparent" }, svg);
    const tip = $("tip");
    hit.addEventListener("mousemove", e => {
      const box = svg.getBoundingClientRect(); const fx = (e.clientX - box.left) / box.width * W2;
      const i = Math.round((fx - ml) / (W2 - ml - mr) * (n - 1));
      moveHov(i); sideHooks.forEach(fn => fn(i));
      if (i < 0 || i >= n || s.level[i] == null) { tip.hidden = true; return; }
      const q = s.change[i] == null ? null : quad(s.level[i], s.change[i]);
      tip.textContent = `${fmtP(set.periods[i])}  taso ${fmtN(s.level[i])}${q ? "  " + Q[q].name : ""}`;
      tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY - 34) + "px";
    });
    hit.addEventListener("mouseleave", () => { tip.hidden = true; moveHov(null); sideHooks.forEach(fn => fn(null)); });
    hit.addEventListener("click", e => { const box = svg.getBoundingClientRect();
      const i = Math.round(((e.clientX - box.left) / box.width * W2 - ml) / (W2 - ml - mr) * (n - 1));
      if (i >= 0 && i < n) { idx = i; update(); } });
    $("tsLegend").innerHTML = QORDER.map(q => `<span style="--qc:${qcol(q)}">${Q[q].name}</span>`).join("");
  }

  /* ---------- heatmap ---------- */
  let hmMode = "lvl";
  $("hm-lvl").onclick = () => { hmMode = "lvl"; update(); };
  $("hm-chg").onclick = () => { hmMode = "chg"; update(); };
  $("hm-raw").onclick = () => { hmMode = "raw"; update(); };
  const fmtRaw = v => v == null ? "–" : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("fi-FI")
    : (+v.toFixed(1) < 0 ? "−" : "") + Math.abs(v).toFixed(1).replace(".", ",");
  function renderHM() {
    const N = set.freq === "M" ? 12 : 8, start = Math.max(0, idx - N + 1);
    const cols = set.periods.slice(start, idx + 1), lvl = hmMode === "lvl", raw = hmMode === "raw";

      : lvl ? "Nuoli: suunta edelliseen jaksoon." : "Standardoitu, kuten kartan vaaka-akseli.";
    const rawCell = (a, k) => { const v = a ? a[k] : null, p = a && k > 0 ? a[k - 1] : null;
      if (v == null) return `<td class="na">–</td>`;
      const rd = x => Math.abs(x) >= 1000 ? Math.round(x) : Math.round(x * 10) / 10;   // nuoli naytetyn tarkkuuden mukaan
      const ar = p == null || rd(v) === rd(p) ? "" : `<span class="ar">${rd(v) > rd(p) ? "▲" : "▼"}</span>`;
      return `<td class="rawc">${fmtRaw(v)}${ar}</td>`; };
    const cell = (l, c) => {
      const v = lvl ? l : c;
      if (v == null) return `<td class="na">–</td>`;
      const t = Math.min(1, Math.abs(v) / 2.5), base = v >= 0 ? "var(--q-up)" : "var(--q-down)";
      const ar = !lvl || c == null ? "" : `<span class="ar">${c >= 0 ? "▲" : "▼"}</span>`;
      return `<td style="background:color-mix(in srgb, ${base} ${Math.round(8 + 52 * t)}%, var(--surface))" title="taso ${l == null ? "–" : fmtN(l)}, muutos ${c == null ? "–" : fmtN(c)}">${fmtN(v)}${ar}</td>`;
    };
    let h = `<thead><tr><th></th>${cols.map(p => `<th>${fmtP(p)}</th>`).join("")}</tr></thead><tbody>`;
    const row = s => raw
      ? `<tr><th class="rl">${s.label}</th>${cols.map((_, k) => rawCell(s.raw, start + k)).join("")}<td class="unit">${s.unit || ""}</td></tr>`
      : `<tr><th class="rl">${s.label}</th>${cols.map((_, k) => cell(s.level[start + k], s.change[start + k])).join("")}</tr>`;
    h += raw ? `<tr><th class="rl">${comp().label}</th>${cols.map(() => `<td class="na">–</td>`).join("")}<td class="unit"></td></tr>` : row(comp());
    set.indicators.forEach(s => { h += row(s); }); h += "</tbody>";
    $("hm").innerHTML = h;
  }

  function setTab(t) { tab = t;

  function renderFoot() {
    $("foot").innerHTML = `<p>Suomen talouden suhdannetilanne avoimista tilastoista. Päivittyy arkisin.</p><details><summary>Menetelmä ja lähteet</summary><div class="fbody"><p><b>Menetelmä.</b> ${D.meta.method}</p><p>${D.meta.composite}</p><p>${D.meta.charts || ""}</p>
      <p><b>Huomio.</b> ${D.meta.caveat} Kartan suurin piste on kokonaisindikaattori, ja viiva näyttää sen kulun kuuden kuukauden ajalta. Haaleat pisteet: sarjan viimeisin havainto on valittua ajankohtaa vanhempi. Ontot pisteet eivät ole mukana kokonaisindikaattorissa.</p>
      <p><b>Lähteet.</b> Tilastokeskus (StatFin: kansantalouden tilinpito, työvoimatutkimus, hinnat ja ansiot, rakentaminen, asuntojen hinnat ja kaupat, konkurssit, kuluttajabarometri), Eurostat (Euroopan komission yritysten luottamuskyselyt ja kapasiteetin käyttöaste, HICP-painot, kaupan ja palvelujen liikevaihto), Suomen Pankki (luotonanto ja lainojen korot), EKP (korot, €STR, tuottokäyrä, valuuttakurssit, rahoitusstressi), Maailmanpankki (raaka-aineiden hinnat, Pink Sheet), FRED (epävarmuusindeksi, Yhdysvaltain ja Japanin korot © OECD, Brent ja WTI © EIA).</p>
      <p><b>Käyttöehdot.</b> Tilastokeskuksen ja Maailmanpankin aineistot CC BY 4.0. Muut aineistot lähteiden käyttöehtojen mukaisesti, lähde mainiten. Epävarmuusindeksi: Baker, Bloom ja Davis, policyuncertainty.com. Laskelmat ja esitystapa ovat omia.</p>
      <p><b>Vastuuvapaus.</b> Sivuston tiedot perustuvat avoimiin lähteisiin, eivätkä ole tarkoitettu sijoitusneuvoiksi.</p></div></details>`;
  }

  function renderMeta() {
    const nAll = set.indicators.length, nComp = set.indicators.filter(s => s.in_composite).length;
    const growthClock = set.indicators.every(x => x.kind === "growth"), M_ = set.freq === "M";
    $("clockTitle").textContent = growthClock ? "Kasvukartta" : "Suhdannekartta";
    $("clockDesc").textContent = growthClock
      ? `Kasvun ero keskiarvoon ja muutos edellisestä ${M_ ? "kuukaudesta" : "neljänneksestä"}`

    const pathIc = `<svg width="22" height="10" viewBox="0 0 22 10" aria-hidden="true"><polyline points="1,8 6,7 11,5 17,3" fill="none" stroke="var(--fg)" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="6" cy="7" r="1.2" fill="var(--fg)" fill-opacity="0.4"/><circle cx="11" cy="5" r="1.2" fill="var(--fg)" fill-opacity="0.5"/><circle cx="17.5" cy="3.5" r="3.2" fill="var(--fg)"/></svg>`;
    $("clockLegend").innerHTML = "";   // selitteet pois: polku ja ontot pisteet selitetty menetelmissa
    $("listMeta").textContent = `Tilanne ${fmtP(set.periods[idx])}`;

  function update() {
    const charts = set.view === "charts", clock = !!(set.indicators && set.indicators.length);
    $("topSec").hidden = !clock; $("detail").hidden = charts; $("charts").hidden = !charts;
    if (clock) { renderMeta(); renderTime(); renderClock(); renderPanel(); } else $("summary").innerHTML = "";

    $("growthSec").hidden = !(charts && set.growth);
    $("finSum").hidden = !(charts && set.summary && set.summary.length);
    if (charts) { renderTiles(); if (set.growth) renderGrowth(); if (set.summary) renderSummary(); renderCharts(); return; }
    if (tab === "ts") renderTS(); else renderHM();
  }

  /* ---------- kasvutaulukko (kansantalous) ---------- */
  let grMode = "yy", grSel = "bkt";
  $("gr-yy").onclick = () => { grMode = "yy"; renderGrowth(); };
  $("gr-qq").onclick = () => { grMode = "qq"; renderGrowth(); };
  function renderGrowth() {
    $("gr-yy").setAttribute("aria-pressed", grMode === "yy"); $("gr-qq").setAttribute("aria-pressed", grMode === "qq");
    $("grTitle").textContent = grMode === "yy" ? "Kasvu vuodentakaisesta" : "Kasvu edellisestä neljänneksestä";
    const ser = id => set.series.find(x => x.id === id), N = 8, P = set.periods, n = P.length;
    const lastOf = id => { const a = ser(id + "_" + grMode).values; for (let k = n - 1; k >= 0; k--) if (a[k] != null) return k; return 0; };
    const end = set.growth.some(r => r.id === "bkt") ? lastOf("bkt") : Math.max(...set.growth.map(r => lastOf(r.id)));
    const cols = P.slice(Math.max(0, end - N + 1), end + 1), i0 = Math.max(0, end - N + 1);
    const rows = [...set.growth].sort((a, b) => (b.id === "bkt") - (a.id === "bkt"));
    let h = `<thead><tr><th></th>${cols.map(p => `<th>${fmtP(p)}</th>`).join("")}</tr></thead><tbody>`;
    rows.forEach(r => {
      const a = ser(r.id + "_" + grMode).values.slice(i0, end + 1), mx = Math.max(...a.filter(v => v != null).map(Math.abs), 0.5);
      h += `<tr data-id="${r.id}" class="pick${r.id === "bkt" ? " tot" : ""}${r.id === grSel ? " on" : ""}" title="Näytä kuvassa"><th class="rl${r.sub ? " sub" : ""}">${r.label}</th>` + a.map(v => {
        if (v == null) return `<td class="na">–</td>`;
        const t = Math.min(1, Math.abs(v) / mx), base = r.neutral ? "var(--accent)" : (v >= 0) !== !!r.invert ? "var(--q-up)" : "var(--q-down)";
        return `<td style="background:color-mix(in srgb, ${base} ${Math.round(6 + (r.neutral ? 34 : 46) * t)}%, var(--surface))">${+v.toFixed(1) > 0 ? "+" : ""}${fmtV(v, 1)}</td>`;
      }).join("") + "</tr>" + (r.gap_after ? `<tr class="gap" aria-hidden="true"><td colspan="${cols.length + 1}"></td></tr>` : "");
    });
    $("grTable").innerHTML = h + "</tbody>";
    $("grTable").querySelectorAll("tr.pick").forEach(tr => tr.onclick = () => { grSel = tr.dataset.id; renderGrowth(); renderCharts(); });
  }

  /* ---------- markkinaruudut: paivittaiset sarjat ---------- */
  const fmtNum = (v, dec) => v.toLocaleString("fi-FI", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const fmtDay = d => `${+d.slice(8, 10)}.${+d.slice(5, 7)}.${d.slice(0, 4)}`;
  function renderTiles() {
    const box = $("tiles"); box.innerHTML = "";
    const chg = (a, b) => (a / b - 1) * 100;
    // korot (abs): muutos korkopisteina (kp = 0,01 %-yks.), muut: prosentteina; pyoristyksen jalkeen nolla = neutraali
    const pill = (lbl, c, abs) => {
      const x = abs ? c * 100 : c, dec = abs ? (Math.abs(x) < 10 ? 1 : 0) : (Math.abs(x) >= 10 ? 1 : 2), r = +x.toFixed(dec);
      const txt = fmtNum(Math.abs(r), dec) + (abs ? " kp" : " %");
      if (r === 0) return `<span class="tcx" style="--tc:var(--muted)"><b>${lbl}</b>${abs ? "0 kp" : "0 %"}</span>`;
      return `<span class="tcx" style="--tc:${r > 0 ? "var(--q-up)" : "var(--q-down)"}"><b>${lbl}</b><i>${r > 0 ? "▲" : "▼"}</i>${txt}</span>`; };
    (set.tiles || []).forEach(t0 => {
      // sama kalenterijakso kaikille (3 kk), vaikka kaupankayntipaivien maara vaihtelee (esim. bitcoin 7 pv/vko)
      const dl = new Date(t0.dates[t0.dates.length - 1]); dl.setMonth(dl.getMonth() - 3);
      const cut = dl.toISOString().slice(0, 10), k0 = Math.max(0, t0.dates.findIndex(d => d >= cut));
      const t = { ...t0, values: t0.values.slice(k0), dates: t0.dates.slice(k0) };
      const v = t.values, n = v.length, last = v[n - 1];
      const dDay = t.abs ? last - v[n - 2] : chg(last, v[n - 2]), dPer = t.abs ? last - v[0] : chg(last, v[0]);
      const days = (new Date(t.dates[n - 1]) - new Date(t.dates[0])) / 864e5, mo = Math.max(1, Math.round(days / 30.4));
      const col = dPer >= 0 ? "var(--q-up)" : "var(--q-down)";
      const div = document.createElement("div"); div.className = "tile";
      div.innerHTML = `<div class="th"><span class="tn">${t.label}</span><span class="td">${fmtDay(t.dates[n - 1])}</span></div>
        <div class="tv">${fmtNum(last, t.dec)}${t.unit ? (t.unit === "%" ? " %" : " " + t.unit) : ""}</div>
        <div class="tcs">${pill("Päivä", dDay, t.abs)}${pill(mo + " kk", dPer, t.abs)}</div>`;
      // kipina: vari ja katkoviiva jakson alun tasosta kertovat jakson muutoksen
      const Wt = 240, Ht = 64, lo = Math.min(...v), hi = Math.max(...v), pad = (hi - lo) * 0.08 || 1;
      const xs = i => i * Wt / (n - 1), ys = y => Ht - (y - lo + pad) / (hi - lo + 2 * pad) * Ht;
      const svg = el("svg", { viewBox: `0 0 ${Wt} ${Ht}`, preserveAspectRatio: "none", role: "img",
        "aria-label": `${t.label}, ${mo} kuukauden kehitys` }, div);
      const d = v.map((y, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)} ${ys(y).toFixed(1)}`).join("");
      el("path", { d: d + `L${Wt} ${Ht}L0 ${Ht}Z`, fill: col, "fill-opacity": 0.08 }, svg);
      el("line", { x1: 0, x2: Wt, y1: ys(v[0]), y2: ys(v[0]), stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3", "vector-effect": "non-scaling-stroke", opacity: 0.6 }, svg);
      el("path", { d, fill: "none", stroke: col, "stroke-width": 1.6, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }, svg);
      box.appendChild(div);
    });
  }

  /* ---------- kuvionakyma: rahoitusmarkkinat ---------- */
  const LINE_COLS = ["var(--accent)", "var(--g2)", "var(--fg)", "var(--q-turn)"];
  const STACK_COLS = ["var(--g1)", "var(--g2)", "var(--g3)", "#c9a56b", "var(--g5)", "#b9c0c8", "#8fb0a6"];
  const fmtV = (v, dec) => { if (v == null) return "–"; const r = +v.toFixed(dec), a = Math.abs(r);
    return (r < 0 ? "−" : "") + (a >= 10000 ? a.toLocaleString("fi-FI", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : a.toFixed(dec).replace(".", ",")); };
  const withU = (v, c) => fmtV(v, c.dec) + (c.unit ? (c.unit === "%" ? " %" : " " + c.unit) : "");
  const niceStep = r => { if (!(r > 0)) return 1;                   // 1, 2, 2,5 tai 5 kertaa 10^k, enintaan noin 5 valia
    const m = Math.pow(10, Math.floor(Math.log10(r / 5)));
    return [1, 2, 2.5, 5, 10].map(f => f * m).find(st => r / st <= 5); };
  const lastNN = a => { for (let k = a.length - 1; k >= 0; k--) if (a[k] != null) return k; return -1; };
  const pctile = (a, v) => { const xs = a.filter(x => x != null); return Math.round(100 * xs.filter(x => x < v).length / xs.length); };
  let chartHooks = [];

  /* ---------- CSV-lataus: puolipiste ja desimaalipilkku (Excel fi), UTF-8 BOM ---------- */
  let dlP = null;
  const csvCell = v => v == null ? "" : typeof v === "number" ? String(+v.toFixed(4)).replace(".", ",") : /[;"\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const toCSV = rows => rows.map(r => r.map(csvCell).join(";")).join("\r\n");
  async function saveFile(filename, text) {
    const data = "\ufeff" + text;
    try {                                   // claude.ai-esikatselussa tallennus kulkee downloads-kyvyn kautta
      if (window.claude && typeof window.claude.use === "function") {
        if (!dlP) dlP = window.claude.use("downloads");
        const dl = await dlP;
        if (dl) { try { await dl.save({ filename, data }); } catch (e) { /* katsoja perui tai ei saatavilla */ } return; }
      }
    } catch (e) { /* jatketaan tavallisella latauksella */ }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/csv;charset=utf-8" }));
    a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  const slug = s => s.toLowerCase().replace(/[åä]/g, "a").replace(/ö/g, "o").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  function chartCSV(c) {
    const ser = id => set.series.find(x => x.id === id), lbl = id => (c.labels && c.labels[id]) || ser(id).label;
    const ids = [...c.lines, ...(c.bars ? [c.bars] : []), ...(c.stack || [])].filter(id => ser(id));
    const i0 = c.from ? Math.max(0, set.periods.indexOf(c.from + "-01")) : 0, rows = [["Jakso", ...ids.map(lbl)]];
    for (let i = i0; i < set.periods.length; i++) { const r = ids.map(id => ser(id).values[i]); if (r.some(v => v != null)) rows.push([set.periods[i], ...r]); }
    saveFile(`suhdannetilanne-${slug(c.title)}.csv`, toCSV(rows));
  }
  $("hm-dl").onclick = () => {
    const key = hmMode === "raw" ? "raw" : hmMode === "lvl" ? "level" : "change", items = [comp(), ...set.indicators];
    const rows = [["Jakso", ...items.map(s => s.label + (hmMode === "raw" && s.unit ? ` (${s.unit})` : ""))]];
    set.periods.forEach((p, i) => { const r = items.map(s => s[key] ? s[key][i] : null); if (r.some(v => v != null)) rows.push([p, ...r]); });
    saveFile(`suhdannetilanne-${slug(set.label)}-${{ raw: "arvo", level: "taso", change: "muutos" }[key]}.csv`, toCSV(rows));
  };
  $("gr-dl").onclick = () => {
    const ser = id => set.series.find(x => x.id === id), rws = set.growth.filter(r => ser(r.id + "_" + grMode));
    const rows = [["Jakso", ...rws.map(r => `${r.label} ${grMode === "yy" ? "v/v" : "q/q"} %`)]];
    set.periods.forEach((p, i) => { const r = rws.map(x => ser(x.id + "_" + grMode).values[i]); if (r.some(v => v != null)) rows.push([p, ...r]); });
    saveFile(`suhdannetilanne-kasvu-${grMode}.csv`, toCSV(rows));
  };

  /* ---------- toisto ajassa ---------- */
  let playT = null;
  function stopPlay() { if (!playT) return; clearInterval(playT); playT = null; $("play").innerHTML = "&#9654;"; $("play").setAttribute("aria-label", "Toista ajassa"); }
  $("play").onclick = () => {
    if (playT) return stopPlay();
    const end = set.periods.length - 1;
    if (end - idx < 6) { const f = set.composite.level.findIndex(v => v != null); idx = Math.max(0, f); update(); }   // lopussa: alusta
    $("play").innerHTML = "&#10074;&#10074;"; $("play").setAttribute("aria-label", "Pysäytä");
    playT = setInterval(() => { if (idx >= end) return stopPlay(); idx++; update(); }, set.freq === "M" ? 160 : 450);
  };

  // rahoitusolot yhdella silmayksella: viimeisin arvo, muutos 3 ja 12 kk, sijoitus historiaan
  function renderSummary() {
    const ser = id => set.series.find(x => x.id === id), y0 = set.periods[0].slice(0, 4);
    const sg = (v, dec) => v == null ? "–" : (+v.toFixed(dec) > 0 ? "+" : "") + fmtV(v, dec);
    let h = `<div class="phead"><h2>Rahoitusolot nyt</h2><span class="meta">Muutos samassa yksikössä; sijoitus = osuus kuukausista vuodesta ${y0}, jolloin arvo oli matalampi</span></div>
      <table><thead><tr><th class="l"></th><th>Viimeisin</th><th>3 kk</th><th>12 kk</th><th class="hide-s">Sijoitus</th></tr></thead><tbody>`;
    set.summary.forEach(r => { const s = ser(r.id); if (!s) return;
      const a = s.values, i = lastNN(a); if (i < 0) return;
      const at = k => (k >= 0 && a[k] != null ? a[k] : null), v = a[i], u = r.unit ? (r.unit === "%" ? " %" : " " + r.unit) : "";
      const d3 = at(i - 3) == null ? null : v - at(i - 3), d12 = at(i - 12) == null ? null : v - at(i - 12), pc = pctile(a, v);
      h += `<tr><th class="l">${r.label || s.label} <span class="d" style="color:var(--muted);font-size:.78rem">${fmtP(set.periods[i])}</span></th>
        <td class="v">${fmtV(v, r.dec)}${u}</td><td class="d">${sg(d3, r.dec)}</td><td class="d">${sg(d12, r.dec)}</td>
        <td class="d hide-s">${pc} %<span class="pb"><i style="width:${pc}%"></i></span></td></tr>`; });
    $("finSum").innerHTML = h + "</tbody></table>";
  }

  /* ---------- tilannetaulukko ja tuottokayra (rahoitusmarkkinat) ---------- */
  const fmtD = d => d.length === 10 ? `${+d.slice(8, 10)}.${+d.slice(5, 7)}.${d.slice(0, 4)}` : fmtP(d);
  const fmtChg = (v, r) => { if (v == null) return "–";
    const dec = r.chg === "kp" ? 0 : r.chg === "pct" ? 1 : r.dec, x = +v.toFixed(dec);
    return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(dec).replace(".", ",") + (r.chg === "kp" ? " kp" : r.chg === "pct" ? " %" : ""); };
  const fmtLast = r => fmtV(r.last, r.dec) + (r.unit ? " " + r.unit : "");
  const COLH = { d1: "1 pv", w1: "1 vk", m1: "1 kk", y1: "1 v", ytd: "Vuoden alusta" };
  function tableCard(c, narrow) {
    const card = document.createElement("div"); card.className = "card fcard tcard" + (narrow ? "" : " half");
    const cols = c.cols || ["d1", "w1", "ytd"];   // kuukausitaulukoissa esim. m1, y1, ytd
    const cnt = {}; c.rows.forEach(r => { cnt[r.date] = (cnt[r.date] || 0) + 1; });   // taulukon paiva = yleisin havaintopaiva
    const maxD = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || (a < b ? 1 : -1))[0] || "";
    let h = `<div class="fhead"><h2>${c.title}</h2><span class="fval">${maxD ? fmtD(maxD) : ""}</span></div>
      <table class="snap${cols[0] === "d1" ? " daily" : ""}"><thead><tr><th></th><th>Viimeisin</th>${cols.map(k => `<th>${COLH[k]}</th>`).join("")}</tr></thead><tbody>`;
    c.rows.forEach(r => {

          const d = B[i]; if (valEl) valEl.innerHTML = `${fmtP(P[i])}: ${c.barsName || "ero"} <b style="color:${c.barsNeutral ? "var(--fg)" : d >= 0 ? "var(--q-up)" : "var(--q-down)"}">${d > 0 ? "+" : ""}${fmtV(d, c.dec)} ${c.barsUnit || "%-yks."}</b>`;
          subEl.textContent = c.lines.map(id => `${ser(id).label} ${withU(L[c.lines.indexOf(id)][i], c)}`).join(", ") + ".";
        } else if (L.length > 1) {
          let j = i; while (j > 0 && L.every(a => a[j] == null)) j--;
          if (valEl) valEl.innerHTML = `${fmtP(P[j])}`;
          const sg = v => c.ts && !c.rawv && v > 0 ? "+" : "";
          subEl.textContent = (c.ts ? `${fmtP(P[j])}: ` : "") +
            c.lines.map(id => { const v = L[c.lines.indexOf(id)][j]; return `${lbl(id)} ${sg(v)}${fmtV(v, c.dec)}${c.unit === "%" ? " %" : ""}`; }).join(", ") +
            (LW && LW[j] != null ? `, ${c.lower.label} ${LW[j] > 0 ? "+" : ""}${fmtV(LW[j], c.lower.dec != null ? c.lower.dec : 1)}` : "") + ".";
        } else {
          const a = L[0]; let j = i; while (j > 0 && a[j] == null) j--;
          if (valEl) valEl.innerHTML = `${fmtP(P[j])}: <b>${withU(a[j], c)}</b>`;
          const y0 = P[a.findIndex(v => v != null)].slice(0, 4);
          subEl.textContent = c.sub || "";
        }
      };
      show(null); chartHooks.push(show);
      const hit = el("rect", { x: ml, y: mt, width: W2 - ml - mr, height: H2 - mt - mb, fill: "transparent" }, svg);
      hit.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect();
        const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) / r.width * W2 - ml) / (W2 - ml - mr) * (n - 1))));
        chartHooks.forEach(fn => fn(i + i0)); });
      hit.addEventListener("pointerleave", () => chartHooks.forEach(fn => fn(null)));
    });
  }

  let lastNarrow = null, lastK = null;
  addEventListener("resize", () => { const c = $("clock"); if (!c || $("topSec").hidden) return;   // kartan pistekoko kapealla
    const k = c.clientWidth < 420; if (k !== lastK) { lastK = k; renderClock(); } });
  addEventListener("resize", () => { if (set.view !== "charts") return;
    const nw = $("charts").clientWidth < 640; if (nw !== lastNarrow) { lastNarrow = nw; renderCharts(); } });
  function renderAll() { renderHeader(); update(); }
  renderFoot(); renderAll();
})();
</script>
