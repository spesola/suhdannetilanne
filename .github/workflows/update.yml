name: Paivitys

on:
  schedule:
    - cron: "17 7 * * 1-5"   # varmistus: paaajastus Cloudflare Workerissa (src/worker.js)
  workflow_dispatch:
    inputs:
      pika:
        description: "Pikajulkaisu: vain ulkoasu (clock_template.html), data edellisestä julkaisusta"
        type: boolean
        default: false

# pikajulkaisu omassa jonossaan, jotta se ei odota eika korvaa jonossa olevaa taysajoa;
# taysajo kokoaa sivun julkaisuhetken uusimmalla pohjalla, joten se ei palauta vanhaa ulkoasua
concurrency: { group: "paivitys-${{ inputs.pika && 'pika' || 'taysi' }}", cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # jos ubuntu.com-nimet eivat ratkea ajokoneella (toistuva katko), apt kayttaa kernel.org-peilia
      - name: Apt-peili
        if: ${{ !inputs.pika }}
        run: |
          if ! getent hosts archive.ubuntu.com >/dev/null || ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            echo "ubuntu.com ei ratkea, vaihdetaan peili"
            echo "http://mirrors.edge.kernel.org/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt
            sudo sed -i -E 's#https?://(azure\.)?(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          fi

      # R:n asennus kayttaa apt-peileja, jotka ovat ajoittain jumittuneet (DNS-virheet); aikaraja ja yksi uusi yritys
      - id: r1
        if: ${{ !inputs.pika }}
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        continue-on-error: true
        with: { use-public-rspm: true }

      - name: R (uusi yritys)
        if: ${{ !inputs.pika && steps.r1.outcome != 'success' }}
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }

      - name: R-paketit
        if: ${{ !inputs.pika }}
        run: Rscript -e 'install.packages(c("httr", "jsonlite", "readxl"))'

      - name: Valimuisti (edelliset onnistuneet haut)
        if: ${{ !inputs.pika }}
        uses: actions/cache@v4
        with:
          path: cache
          key: sarjat-${{ github.run_id }}
          restore-keys: sarjat-

      - name: Aja putki
        id: run
        if: ${{ !inputs.pika }}
        continue-on-error: true
        env: { LANG: C.UTF-8, STRICT: "1" }
        run: Rscript pipeline.R

      - name: Pikajulkaisu (data edellisestä julkaisusta)
        if: ${{ inputs.pika }}
        run: |
          curl -fsS --retry 3 -o clock.json https://suhdannetilanne.fi/clock.json
          python3 tools/kokoa_sivu.py

      - name: Uusin sivupohja (ajon aikana tehdyt ulkoasumuutokset)
        if: ${{ !inputs.pika && hashFiles('clock.json') != '' }}
        run: |
          if git fetch -q --depth 1 origin main && git show origin/main:clock_template.html > /tmp/pohja.html; then mv /tmp/pohja.html clock_template.html; fi
          python3 tools/kokoa_sivu.py

      - name: Kokoa julkaisu
        if: hashFiles('suhdannetilanne.html') != ''
        run: |
          mkdir -p public
          # doctype ja kieli: ilman doctypea selain kayttaa quirks-tilaa
          { echo '<!doctype html><html lang="fi">'; cat suhdannetilanne.html; } > public/index.html
          cp clock.json favicon.svg public/
          cp -r fonts public/
          # sivustokartta hakukoneille, muutospaivana julkaisupaiva
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://suhdannetilanne.fi/</loc><lastmod>%s</lastmod><changefreq>daily</changefreq></url></urlset>\n' "$(date -u +%Y-%m-%d)" > public/sitemap.xml

      - name: Savutesti (estää julkaisun, jos sivu on rikki)
        if: hashFiles('public/index.html') != ''
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/smoke.js public/index.html

      - name: Julkaise Cloudflareen
        id: deploy
        if: hashFiles('public/index.html') != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.154.0"
          command: deploy

      - name: Odota ennen uutta yritystä
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Julkaise Cloudflareen (uusi yritys)
        # Cloudflaren API palauttaa toisinaan tilapaisen virheen (esim. code 10013)
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.154.0"
          command: deploy

      - name: Ilmoita tarkistushuomioista
        if: steps.run.outcome == 'failure'
        run: |
          echo "Putki paattyi virheeseen tai tarkistushuomioihin, katso Aja putki -vaiheen loki."
          exit 1
